name: Deploy to Server

on:
  push:
    paths:
      - 'index.html'
      - 'about.html'
      - 'editor.html'
      - 'icon.jpg'
      - 'data/bookmarks.json'
      - 'assets/**'
      - 'sw.js'
      - 'tools/build-deploy.mjs'
      - '.github/workflows/deploy.yml'
    branches:
      - main  # 根据你的默认分支名称修改，可能是 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare versioned static files
        run: |
          node ./tools/build-deploy.mjs _deploy "${GITHUB_SHA}"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            rm -f /opt/1panel/www/sites/mygo.neu.fan/index/sw.js
            
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "_deploy"
          target: "/opt/1panel/www/sites/mygo.neu.fan/index"
          overwrite: true
          strip_components: 1
