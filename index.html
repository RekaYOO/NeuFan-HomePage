    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const searchQuery = ref('');
                const isModeAnimating = ref(false);
                const showModeStatusChip = ref(false);
                let overlayTimer = null;
                let modeStatusTimer = null;
                const showBeian = ref(true);
                const bookmarksLoading = ref(true);
                const bookmarksError = ref(false);
                const bookmarks = ref({});
                const loadBookmarks = async () => {
                    bookmarksLoading.value = true;
                    bookmarksError.value = false;

                    // 生产部署时由构建脚本注入，源码和编辑器仍继续维护 data/bookmarks.json。
                    if (globalThis.__NEUFAN_BOOKMARKS__) {
                        bookmarks.value = globalThis.__NEUFAN_BOOKMARKS__;
                        bookmarksLoading.value = false;
                        return;
                    }

                    if (window.location.protocol === 'file:') {
                        bookmarksError.value = true;
                        bookmarksLoading.value = false;
                        bookmarks.value = {};
                        console.warn('本地 file:// 模式无法直接 fetch data/bookmarks.json，请使用静态服务器访问。');
                        return;
                    }

                    try {
                        // GitHub Actions 会在部署副本中把占位符替换为当前 commit SHA。
                        // 同一版本可直接使用浏览器缓存，数据变更后的新 commit 则会使用新 URL。
                        const response = await fetch('./data/bookmarks.json?v=__DEPLOY_VERSION__', { cache: 'force-cache' });
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        bookmarks.value = await response.json();
                    } catch (error) {
                        console.error('加载书签数据失败:', error);
                        bookmarksError.value = true;
                        bookmarks.value = {};
                    } finally {
                        bookmarksLoading.value = false;
                    }
                };
                const currentPage = ref('quick');
                const pageOrder = ['quick', 'neu', 'tool','ai','academic'];
                const currentIndex = ref(0);
                const useAnimation = ref(false);
                // 0: 直连模式, 1: 校内模式(http), 2: 备用模式(https)
                const webvpnMode = ref(0);
                // 是否锁定页面（禁用悬浮切换）
                const pageLocked = ref(false);

                // 隐藏列表 - 这些名称默认不显示，需要 ?t=all 参数才显示
                const hiddenItems = ['工具'];
                const showAll = ref(new URLSearchParams(window.location.search).get('t') === 'all');

                // 实现AES-CFB模式的加密函数
                // 通过资源访问控制系统访问校内网址功能实现参考自https://github.com/w43322/neu-webvpn-anysite/tree/main
                // originalProtocol: 原始链接的协议 ('http' 或 'https')
                // port: 端口号（可选）
                async function encryptUrlBrowser(url, originalProtocol = 'http', port = null) {
                    const keyString = 'b0A58a69394ce73@';
                    const ivString = 'b0A58a69394ce73@';

                    const keyBytes = new TextEncoder().encode(keyString);
                    const ivBytes = new TextEncoder().encode(ivString);

                    // 导入AES密钥
                    const aesKey = await crypto.subtle.importKey(
                        'raw',
                        keyBytes,
                        { name: 'AES-CBC' },
                        false,
                        ['encrypt']
                    );

                    // CFB-128模式
                    async function aes_cfb_encrypt(plaintext, key, iv) {
                        const blockSize = 16;
                        const result = new Uint8Array(plaintext.length);
                        let shiftRegister = new Uint8Array(iv);

                        for (let i = 0; i < plaintext.length; i += blockSize) {
                            // 加密移位寄存器
                            const paddedRegister = new Uint8Array(blockSize);
                            paddedRegister.set(shiftRegister);
                            
                            const encryptedBlock = await crypto.subtle.encrypt(
                                { name: 'AES-CBC', iv: new Uint8Array(16) },
                                key,
                                paddedRegister
                            );
                            
                            const keyStream = new Uint8Array(encryptedBlock).slice(0, blockSize);
                            
                            // XOR操作
                            const chunkSize = Math.min(blockSize, plaintext.length - i);
                            const cipherChunk = new Uint8Array(chunkSize);
                            
                            for (let j = 0; j < chunkSize; j++) {
                                cipherChunk[j] = plaintext[i + j] ^ keyStream[j];
                                result[i + j] = cipherChunk[j];
                            }
                            
                            // 更新移位寄存器 (CFB-128: 整个块都用作反馈)
                            if (i + blockSize < plaintext.length) {
                                shiftRegister = cipherChunk.length === blockSize ? 
                                    cipherChunk : 
                                    new Uint8Array([...shiftRegister.slice(chunkSize), ...cipherChunk]);
                            }
                        }
                        
                        return result;
                    }

                    const paddedLength = Math.floor(url.length / 16) * 16 + 16;
                    let paddedUrl = url;
                    while (paddedUrl.length < paddedLength) {
                        paddedUrl += '\0';
                    }

                    const plaintext = new TextEncoder().encode(paddedUrl);
                    const ciphertext = await aes_cfb_encrypt(plaintext, aesKey, ivBytes);
                    
                    const slicedCipherText = ciphertext.slice(0, url.length);
                    const hexCipherText = Array.from(slicedCipherText)
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('');

                    // 校内模式(1): 根据原始链接协议; 备用模式(2): 强制https
                    const protocol = webvpnMode.value === 2 ? 'https' : originalProtocol;
                    // 如果有端口号，使用 http-端口号 格式
                    const protocolPath = port ? `${protocol}-${port}` : protocol;
                    return `https://webvpn.neu.edu.cn/${protocolPath}/62304135386136393339346365373340` + hexCipherText;
                }

                // 处理URL的函数
                const getProcessedUrl = (originalUrl) => {
                    if (!webvpnMode.value) {
                        return originalUrl;
                    }

                    // 移除协议前缀，只保留域名和路径
                    let cleanUrl = originalUrl.replace(/^https?:\/\//, '');

                    // 分离域名和路径
                    const urlParts = cleanUrl.split('/');
                    const domain = urlParts[0]; // 获取域名部分
                    const pathPart = urlParts.length > 1 ? '/' + urlParts.slice(1).join('/') : ''; // 获取路径部分

                    // 先处理域名部分（这里可以添加域名的特殊处理逻辑）
                    let processedDomain = domain;

                    // 重新组合：处理后的域名 + 路径
                    const finalUrl = processedDomain + pathPart;

                    // 如果是异步加密，我们需要在组件中处理
                    // 这里先返回处理后的URL，实际加密在点击时处理
                    return finalUrl;
                };

                // 切换模式 (三态循环: 0 -> 1 -> 2 -> 0)
                const getModeColor = (mode) => {
                    switch (mode) {
                        case 1: return { solid: '#ff6b35', soft: 'rgba(255, 107, 53, 0.12)', strong: 'rgba(255, 107, 53, 0.24)' };
                        case 2: return { solid: '#9c27b0', soft: 'rgba(156, 39, 176, 0.12)', strong: 'rgba(156, 39, 176, 0.22)' };
                        default: return { solid: '#666666', soft: 'rgba(102, 102, 102, 0.10)', strong: 'rgba(102, 102, 102, 0.18)' };
                    }
                };

                const triggerModeSwitchAnimation = (nextMode) => {
                    const modeColor = getModeColor(nextMode);
                    const headerElement = document.querySelector('header');
                    const scanStartY = headerElement ? `${headerElement.getBoundingClientRect().bottom}px` : '180px';

                    document.body.style.setProperty('--mode-color', modeColor.solid);
                    document.body.style.setProperty('--mode-color-soft', modeColor.soft);
                    document.body.style.setProperty('--mode-color-strong', modeColor.strong);
                    document.body.style.setProperty('--scan-start-y', scanStartY);

                    isModeAnimating.value = false;
                    showModeStatusChip.value = false;
                    document.body.classList.remove('mode-switching');
                    if (overlayTimer) {
                        clearTimeout(overlayTimer);
                    }
                    if (modeStatusTimer) {
                        clearTimeout(modeStatusTimer);
                    }

                    requestAnimationFrame(() => {
                        isModeAnimating.value = true;
                        showModeStatusChip.value = true;
                        document.body.classList.add('mode-switching');
                        overlayTimer = setTimeout(() => {
                            isModeAnimating.value = false;
                            document.body.classList.remove('mode-switching');
                        }, 900);
                        modeStatusTimer = setTimeout(() => {
                            showModeStatusChip.value = false;
                        }, 1600);
                    });
                };

                const toggleWebVPN = (event) => {
                    const nextMode = (webvpnMode.value + 1) % 3;
                    webvpnMode.value = nextMode;
                    triggerModeSwitchAnimation(nextMode);
                };

                // 获取按钮文字
                const webvpnButtonText = computed(() => {
                    switch (webvpnMode.value) {
                        case 0: return '直连模式';
                        case 1: return '校内模式';
                        case 2: return '备用模式';
                        default: return '直连模式';
                    }
                });

                const modeStatusText = computed(() => {
                    switch (webvpnMode.value) {
                        case 0: return '当前直连';
                        case 1: return '当前校内';
                        case 2: return '当前备用';
                        default: return '当前直连';
                    }
                });

                const modeStatusIcon = computed(() => {
                    switch (webvpnMode.value) {
                        case 0: return '·';
                        case 1: return '⌂';
                        case 2: return '✦';
                        default: return '·';
                    }
                });

                // 判断是否支持访问 - 移除此函数，所有网址都支持
                // const isWebVPNSupported = (url, currentPage, categoryName) => {
                //     // 只支持快速页面的"平台"分类和校内页面的所有分类
                //     if (currentPage === 'quick' && categoryName === '平台') {
                //         return true;
                //     }
                //     if (currentPage === 'neu') {
                //         return true;
                //     }
                //     return false;
                // };

                // 处理链接点击事件
                const handleLinkClick = async (event, originalUrl, categoryName = '', linkData = null) => {
                    // 如果链接被禁用，阻止点击
                    if (linkData && linkData.disabled) {
                        event.preventDefault();
                        return;
                    }

                    // 解析URL，获取协议、域名、端口、路径
                    const parseUrl = (url) => {
                        const protocol = url.startsWith('https://') ? 'https' : 'http';
                        let cleanUrl = url.replace(/^https?:\/\//, '');
                        const pathIndex = cleanUrl.indexOf('/');
                        const hostPart = pathIndex > -1 ? cleanUrl.substring(0, pathIndex) : cleanUrl;
                        const pathPart = pathIndex > -1 ? cleanUrl.substring(pathIndex) : '';
                        
                        // 解析域名和端口
                        const portMatch = hostPart.match(/^(.+):(\d+)$/);
                        let domain, port;
                        if (portMatch) {
                            domain = portMatch[1];
                            port = portMatch[2];
                        } else {
                            domain = hostPart;
                            port = null;
                        }
                        
                        return { protocol, domain, port, pathPart };
                    };

                    // 处理直接跳转
                    if (originalUrl.startsWith('vpn ')) {
                        event.preventDefault();
                        return;
                    }

                    // 处理搜索场景生成的按钮（新标签页打开，不强制校内但支持校内访问）
                    if (linkData && linkData.isSearchAccess) {
                        event.preventDefault();
                        
                        if (webvpnMode.value > 0) {
                            // 校内模式：通过WebVPN访问
                            try {
                                const { protocol, domain, port, pathPart } = parseUrl(originalUrl);
                                const encryptedDomainUrl = await encryptUrlBrowser(domain, protocol, port);
                                const finalUrl = encryptedDomainUrl + pathPart;
                                window.open(finalUrl, '_blank');
                                searchQuery.value = ''; // 清空输入框
                            } catch (error) {
                                console.error('WebVPN访问失败:', error);
                                window.open(originalUrl, '_blank');
                                searchQuery.value = ''; // 清空输入框
                            }
                        } else {
                            // 直连模式：直接打开原始URL
                            window.open(originalUrl, '_blank');
                            searchQuery.value = ''; // 清空输入框
                        }
                        return;
                    }

                    // 处理学术数据库访问场景（需要校内访问支持）
                    if (linkData && linkData.isAcademicAccess) {
                        event.preventDefault();

                        if (webvpnMode.value > 0) {
                            try {
                                const { protocol, domain, port, pathPart } = parseUrl(originalUrl);
                                const encryptedDomainUrl = await encryptUrlBrowser(domain, protocol, port);
                                const finalUrl = encryptedDomainUrl + pathPart;
                                window.open(finalUrl, '_blank');
                                searchQuery.value = ''; // 清空输入框
                            } catch (error) {
                                console.error('WebVPN访问失败:', error);
                                window.open(originalUrl, '_blank');
                                searchQuery.value = ''; // 清空输入框
                            }
                        } else {
                            // 直连模式：直接打开原始URL
                            window.open(originalUrl, '_blank');
                            searchQuery.value = ''; // 清空输入框
                        }
                        return;
                    }

                    // 处理直接访问链接
                    if (linkData && linkData.isDirectAccess) {
                        event.preventDefault();

                        if (webvpnMode.value > 0) {
                            // 校内模式：通过WebVPN访问
                            try {
                                const { protocol, domain, port, pathPart } = parseUrl(originalUrl);

                                // 只加密域名部分，传入原始协议和端口
                                const encryptedDomainUrl = await encryptUrlBrowser(domain, protocol, port);
                                // 将路径原文拼接到加密后的域名URL后面
                                const finalUrl = encryptedDomainUrl + pathPart;

                                window.location.href = finalUrl;
                            } catch (error) {
                                console.error('WebVPN访问失败:', error);
                                // 如果WebVPN失败，直接访问
                                window.location.href = originalUrl;
                            }
                        } else {
                            // 普通模式：直接访问
                            window.location.href = originalUrl;
                        }
                        return;
                    }

                    if (webvpnMode.value > 0) {
                        event.preventDefault();

                        const { protocol, domain, port, pathPart } = parseUrl(originalUrl);

                        try {
                            // 只加密域名部分，传入原始协议和端口
                            const encryptedDomainUrl = await encryptUrlBrowser(domain, protocol, port);
                            // 将路径原文拼接到加密后的域名URL后面
                            const finalUrl = encryptedDomainUrl + pathPart;

                            window.location.href = finalUrl; // 在当前页面打开
                        } catch (error) {
                            console.error('加密失败:', error);
                            window.location.href = originalUrl; // 在当前页面打开原链接
                        }
                    }
                };

                // 页面配置
                const pages = ref([
                    { id: 'quick', name: '快速' },
                    { id: 'neu', name: '校内' },
                    { id: 'tool', name: '工具' },
                    { id: 'ai', name: 'AI' },
                    { id: 'academic', name: '学术' }
                ]);

                // 过滤后的页面（根据 showAll 状态）
                const filteredPages = computed(() => {
                    if (showAll.value) return pages.value;
                    return pages.value.filter(p => !hiddenItems.includes(p.name));
                });

                // 过滤后的页面顺序
                const filteredPageOrder = computed(() => {
                    return filteredPages.value.map(p => p.id);
                });

                const isValidUrl = (text) => {
                    if (!text || typeof text !== 'string') return false;
                    const trimmed = text.trim();
                    if (!trimmed) return false;

                    try {
                        const normalized = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
                        const url = new URL(normalized);
                        return Boolean(url.hostname && url.hostname.includes('.'));
                    } catch {
                        return false;
                    }
                };

                const handlePageChange = (pageId) => {
                    currentPage.value = pageId;
                    currentIndex.value = filteredPageOrder.value.indexOf(pageId);
                    useAnimation.value = false;
                };

                const handlePageClick = (pageId) => {
                    if (pageId === currentPage.value) {
                        pageLocked.value = !pageLocked.value;
                    } else {
                        currentPage.value = pageId;
                        currentIndex.value = filteredPageOrder.value.indexOf(pageId);
                        pageLocked.value = true;
                    }
                    useAnimation.value = true;
                };

                const handleArrowClick = () => {
                    if (!filteredPageOrder.value.length) return;
                    currentIndex.value = (currentIndex.value + 1) % filteredPageOrder.value.length;
                    currentPage.value = filteredPageOrder.value[currentIndex.value];
                    pageLocked.value = !pageLocked.value;
                    useAnimation.value = true;
                };

                loadBookmarks();

                // 全局键盘监听：直接打字自动聚焦搜索框并输入
                document.addEventListener('keydown', (e) => {
                    const tag = document.activeElement?.tagName?.toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || document.activeElement?.isContentEditable) return;
                    if (e.ctrlKey || e.altKey || e.metaKey) return;
                    if (e.key.length > 1) return;

                    e.preventDefault();
                    const searchInput = document.querySelector('header input[type="text"]');
                    if (searchInput) {
                        searchInput.focus();
                        searchQuery.value += e.key;
                    }
                });

                // 书签数据
                const filteredCategories = computed(() => {
                    const query = searchQuery.value.trim();

                    // 检查域名是否存在于学术板块
                    const checkAcademicDomain = (url) => {
                        let cleanUrl = url.replace(/^https?:\/\//, '');
                        const pathIndex = cleanUrl.indexOf('/');
                        const hostPart = pathIndex > -1 ? cleanUrl.substring(0, pathIndex) : cleanUrl;
                        // 移除端口号
                        const domain = hostPart.replace(/:\d+$/, '');
                        
                        const academicBookmarks = bookmarks.value['academic'] || [];
                        for (const category of academicBookmarks) {
                            for (const link of category.links) {
                                let linkDomain = link.url.replace(/^https?:\/\//, '');
                                const linkPathIndex = linkDomain.indexOf('/');
                                linkDomain = linkPathIndex > -1 ? linkDomain.substring(0, linkPathIndex) : linkDomain;
                                linkDomain = linkDomain.replace(/:\d+$/, '');
                                
                                if (domain === linkDomain || domain.endsWith('.' + linkDomain) || linkDomain.endsWith('.' + domain)) {
                                    return true;
                                }
                            }
                        }
                        return false;
                    };

                    // 如果有搜索条件，从所有页面搜索
                    if (query) {
                        const allResults = [];
                        const lowerQuery = query.toLowerCase();

                    // 遍历所有页面（搜索时显示所有，包括隐藏的）
                    const pagesToSearch = showAll.value ? Object.keys(bookmarks.value) : 
                        Object.keys(bookmarks.value).filter(key => {
                            const pageInfo = pages.value.find(p => p.id === key);
                            return pageInfo && !hiddenItems.includes(pageInfo.name);
                        });
                    
                    pagesToSearch.forEach(pageKey => {
                            const pageBookmarks = bookmarks.value[pageKey];
                            pageBookmarks.forEach(category => {
                                const matchedLinks = category.links.filter(link =>
                                    link.name.toLowerCase().includes(lowerQuery) ||
                                    link.url.toLowerCase().includes(lowerQuery) ||
                                    (link.aliases && link.aliases.some(alias => alias.toLowerCase().includes(lowerQuery)))
                                );

                                if (matchedLinks.length > 0) {
                                    // 找到匹配的分类，添加页面信息
                                    const pageInfo = pages.value.find(p => p.id === pageKey);
                                    allResults.push({
                                        name: `${category.name} (${pageInfo ? pageInfo.name : pageKey})`,
                                        links: matchedLinks
                                    });
                                }
                            });
                        });

                        // 如果没有搜索结果且输入看起来像URL，添加直接跳转选项
                        if (allResults.length === 0 && isValidUrl(query)) {
                            // 确保URL有协议前缀
                            let processedUrl = query;
                            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                                processedUrl = 'https://' + query;
                            }

                            // 检查是否是学术数据库域名
                            const isAcademic = checkAcademicDomain(processedUrl);
                            
                            // 限制显示文本长度
                            const truncateText = (text, maxLength = 30) => {
                                return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
                            };
                            
                            if (isAcademic) {
                                // 学术数据库域名
                                allResults.push({
                                    name: '此数据库从校园网或校内模式访问免费',
                                    links: [{
                                        name: `访问 ${truncateText(query)}`,
                                        url: processedUrl,
                                        isDirectAccess: true,
                                        isAcademicAccess: true
                                    }]
                                });
                            } else {
                                allResults.push({
                                    name: webvpnMode.value > 0 ? '校内访问' : '直接访问',
                                    links: [{
                                        name: `访问 ${truncateText(query)}`,
                                        url: processedUrl,
                                        isDirectAccess: true
                                    }]
                                });
                            }
                        } else if (allResults.length === 0 && !isValidUrl(query)) {
                            // 如果搜索词不是URL且没有匹配结果，显示搜索选项
                            const encodedQuery = encodeURIComponent(query);
                            allResults.push({
                                name: '在以下站点内搜索',
                                links: [
                                    {
                                        name: '谷歌学术',
                                        url: `https://scholar.google.com/scholar?hl=zh-CN&as_sdt=0%2C5&q=${encodedQuery}&btnG=`,
                                        isSearchAccess: true  // 使用新的标识
                                    },
                                    {
                                        name: '谷歌学术镜像',
                                        url: `https://scholar.lanfanshu.cn/scholar?hl=zh-CN&as_sdt=0%2C5&q=${encodedQuery}`,
                                        isSearchAccess: true
                                    },
                                    {
                                        name: 'Medcite',
                                        url: `https://medcite.cn/search/${encodedQuery}`,
                                        isSearchAccess: true
                                    },
                                    {
                                        name: '知网',
                                        url: `https://kns.cnki.net/kns8s/defaultresult/index?kw=${encodedQuery}`,
                                        isSearchAccess: true
                                    },
                                    {
                                        name: '东大智搜',
                                        url: `https://so.neu.edu.cn/#/index?searchWord=${encodedQuery}&module=default&current=1`,
                                        isSearchAccess: true
                                    }
                                ]
                            });
                        }

                        return allResults;
                    }

                    // 没有搜索条件时，显示当前页面内容
                    const currentBookmarks = bookmarks.value[currentPage.value] || [];
                    return currentBookmarks.map(category => {
                        return {
                            ...category,
                            links: category.links
                        };
                    });
                });

                return {
                    searchQuery,
                    bookmarksLoading,
                    bookmarksError,
                    filteredCategories,
                    showBeian,
                    currentPage,
                    filteredPages,
                    pageLocked,
                    handlePageChange,
                    handlePageClick,
                    handleArrowClick,
                    useAnimation,
                    webvpnMode,
                    isModeAnimating,
                    showModeStatusChip,
                    toggleWebVPN,
                    webvpnButtonText,
                    modeStatusText,
                    modeStatusIcon,
                    getProcessedUrl,
                    handleLinkClick
                };
            }
        }).mount('#app');

        // 清理旧版本曾注册的 Service Worker；生产首页现已在部署时合并为单文件。
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration('./')
                .then(registration => registration && registration.unregister())
                .catch(error => console.warn('旧版静态资源缓存清理失败:', error));
        }
        if ('caches' in window) {
            caches.delete('neufan-static-v1')
                .catch(error => console.warn('旧版静态资源缓存删除失败:', error));
        }
    </script>
</body>
