                const useAnimation = ref(false);
                // 0: 直连模式, 1: 校内模式(http), 2: 备用模式(https)
                const webvpnMode = ref(0);
                // 是否锁定页面（禁用悬浮切换）
                const pageLocked = ref(false);

                // 隐藏列表 - 这些名称默认不显示，需要 ?t=all 参数才显示
                const hiddenItems = ['工具'];
                const showAll = ref(new URLSearchParams(window.location.search).get('t') === 'all');

                // 实现AES-CFB模式的加密函数
                // 通过资源访问控制系统访问校内网址功能实现参考自https://github.com/w43322/neu-webvpn-anysite/tree/main
                // originalProtocol: 原始链接的协议 ('http' 或 'https')
                // port: 端口号（可选）
                async function encryptUrlBrowser(url, originalProtocol = 'http', port = null) {
                    const keyString = 'b0A58a69394ce73@';
                    const ivString = 'b0A58a69394ce73@';

                    const keyBytes = new TextEncoder().encode(keyString);
                    const ivBytes = new TextEncoder().encode(ivString);

                    // 导入AES密钥
                    const aesKey = await crypto.subtle.importKey(
                        'raw',
                        keyBytes,
                        { name: 'AES-CBC' },
                        false,
                        ['encrypt']
                    );

                    // CFB-128模式
                    async function aes_cfb_encrypt(plaintext, key, iv) {
                        const blockSize = 16;
                        const result = new Uint8Array(plaintext.length);
                        let shiftRegister = new Uint8Array(iv);

                        for (let i = 0; i < plaintext.length; i += blockSize) {
                            // 加密移位寄存器
                            const paddedRegister = new Uint8Array(blockSize);
                            paddedRegister.set(shiftRegister);
                            
                            const encryptedBlock = await crypto.subtle.encrypt(
                                { name: 'AES-CBC', iv: new Uint8Array(16) },
                                key,
                                paddedRegister
                            );
                            
                            const keyStream = new Uint8Array(encryptedBlock).slice(0, blockSize);
                            
                            // XOR操作
                            const chunkSize = Math.min(blockSize, plaintext.length - i);
                            const cipherChunk = new Uint8Array(chunkSize);
                            
                            for (let j = 0; j < chunkSize; j++) {
                                cipherChunk[j] = plaintext[i + j] ^ keyStream[j];
                                result[i + j] = cipherChunk[j];
                            }
                            
                            // 更新移位寄存器 (CFB-128: 整个块都用作反馈)
                            if (i + blockSize < plaintext.length) {
                                shiftRegister = cipherChunk.length === blockSize ? 
                                    cipherChunk : 
                                    new Uint8Array([...shiftRegister.slice(chunkSize), ...cipherChunk]);
                            }
                        }
                        
                        return result;
                    }

                    const paddedLength = Math.floor(url.length / 16) * 16 + 16;
                    let paddedUrl = url;
                    while (paddedUrl.length < paddedLength) {
                        paddedUrl += '\0';
                    }

                    const plaintext = new TextEncoder().encode(paddedUrl);
                    const ciphertext = await aes_cfb_encrypt(plaintext, aesKey, ivBytes);
                    
                    const slicedCipherText = ciphertext.slice(0, url.length);
                    const hexCipherText = Array.from(slicedCipherText)
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('');

                    // 校内模式(1): 根据原始链接协议; 备用模式(2): 强制https
                    const protocol = webvpnMode.value === 2 ? 'https' : originalProtocol;
                    // 如果有端口号，使用 http-端口号 格式
                    const protocolPath = port ? `${protocol}-${port}` : protocol;
                    return `https://webvpn.neu.edu.cn/${protocolPath}/62304135386136393339346365373340` + hexCipherText;
                }

                // 处理URL的函数
                const getProcessedUrl = (originalUrl) => {
                    if (!webvpnMode.value) {
                        return originalUrl;
                    }

                    // 移除协议前缀，只保留域名和路径
                    let cleanUrl = originalUrl.replace(/^https?:\/\//, '');

                    // 分离域名和路径
                    const urlParts = cleanUrl.split('/');
                    const domain = urlParts[0]; // 获取域名部分
                    const pathPart = urlParts.length > 1 ? '/' + urlParts.slice(1).join('/') : ''; // 获取路径部分

                    // 先处理域名部分（这里可以添加域名的特殊处理逻辑）
                    let processedDomain = domain;

                    // 重新组合：处理后的域名 + 路径
                    const finalUrl = processedDomain + pathPart;

                    // 如果是异步加密，我们需要在组件中处理
                    // 这里先返回处理后的URL，实际加密在点击时处理
                    return finalUrl;
                };

                // 切换模式 (三态循环: 0 -> 1 -> 2 -> 0)
                const toggleWebVPN = () => {
                    webvpnMode.value = (webvpnMode.value + 1) % 3;
                };

                // 获取按钮文字
                const webvpnButtonText = computed(() => {
                    switch (webvpnMode.value) {
                        case 0: return '直连模式';
                        case 1: return '校内模式';
                        case 2: return '备用模式';
                        default: return '直连模式';

                // 处理链接点击事件
                const handleLinkClick = async (event, originalUrl, categoryName = '', linkData = null) => {
                    // 如果链接被禁用，阻止点击
                    if (linkData && linkData.disabled) {

                    // 解析URL，获取协议、域名、端口、路径
                    const parseUrl = (url) => {
                        const protocol = url.startsWith('https://') ? 'https' : 'http';
                        let cleanUrl = url.replace(/^https?:\/\//, '');
                        const pathIndex = cleanUrl.indexOf('/');
                        const hostPart = pathIndex > -1 ? cleanUrl.substring(0, pathIndex) : cleanUrl;
                        const pathPart = pathIndex > -1 ? cleanUrl.substring(pathIndex) : '';
                        
                        // 解析域名和端口
                        const portMatch = hostPart.match(/^(.+):(\d+)$/);
                        let domain, port;
                        if (portMatch) {
                            domain = portMatch[1];
                            port = portMatch[2];
                        } else {
                            domain = hostPart;
                            port = null;
                        }
                        
                        return { protocol, domain, port, pathPart };
                    };

                    // 处理直接跳转
                    if (originalUrl.startsWith('vpn ')) {
                        event.preventDefault();
                        const input = originalUrl.slice(4);
                        const { domain, port } = parseUrl('http://' + input);
                        try {
                            const encryptedUrl = await encryptUrlBrowser(domain, 'http', port);
                            window.location.href = encryptedUrl;
                        } catch (error) {
                            console.error('跳转失败:', error);
                            alert('此地址无法从校内访问，请检查地址正确性');
                        }

                                const finalUrl = encryptedDomainUrl + pathPart;
                                window.open(finalUrl, '_blank');
                                searchQuery.value = ''; // 清空输入框
                            } catch (error) {

                                window.open(originalUrl, '_blank');
                                searchQuery.value = ''; // 清空输入框
                            }
                        }
                        return;
                    }

                    // 处理直接访问链接
                    if (linkData && linkData.isDirectAccess) {
                        event.preventDefault();

                        if (webvpnMode.value > 0) {
                            // 校内模式：通过WebVPN访问
                            try {
                                const { protocol, domain, port, pathPart } = parseUrl(originalUrl);

                                // 只加密域名部分，传入原始协议和端口
                                const encryptedDomainUrl = await encryptUrlBrowser(domain, protocol, port);
                                // 将路径原文拼接到加密后的域名URL后面
                                const finalUrl = encryptedDomainUrl + pathPart;

                                window.location.href = finalUrl;
                            } catch (error) {
                                console.error('WebVPN访问失败:', error);
                                // 如果WebVPN失败，直接访问
                                window.location.href = originalUrl;
                            }
                        } else {
                            // 普通模式：直接访问
                            window.location.href = originalUrl;
                        }
                        return;
                    }

                    if (webvpnMode.value > 0) {
                        event.preventDefault();

                        const { protocol, domain, port, pathPart } = parseUrl(originalUrl);

                        try {
                            // 只加密域名部分，传入原始协议和端口
                            const encryptedDomainUrl = await encryptUrlBrowser(domain, protocol, port);
                            // 将路径原文拼接到加密后的域名URL后面
                            const finalUrl = encryptedDomainUrl + pathPart;

                            window.location.href = finalUrl; // 在当前页面打开
                        } catch (error) {
                            console.error('加密失败:', error);
                            window.location.href = originalUrl; // 在当前页面打开原链接
                        }
                    }
                };

                const pages = ref([
                    { id: 'quick', name: '快速' },

                    { id: 'tool', name: '工具' },
                    { id: 'ai', name: 'AI' },
                    { id: 'academic', name: '学术' }

                    if (showAll.value) return pages.value;
                    return pages.value.filter(p => !hiddenItems.includes(p.name));

                // 检查是否是直接跳转模式
                const isVpnDirectMode = computed(() => {
                    return searchQuery.value.trim().toLowerCase().startsWith('vpn ');
                });

                // 获取跳转域名
                const vpnDirectDomain = computed(() => {
                    if (isVpnDirectMode.value) {
                        return searchQuery.value.slice(4).trim();
                    }
                    return '';
                });

                // 处理直接跳转
                const handleVpnDirectJump = async () => {
                    const domain = vpnDirectDomain.value;
                    if (!domain) {
                        alert('请输入有效的域名');
                        return;
                    }
                    
                    try {
                        const encryptedUrl = await encryptUrlBrowser(domain);
                        window.location.href = encryptedUrl;
                    } catch (error) {
                        console.error('跳转失败:', error);
                        alert('失败，请检查域名格式');
                    }
                };

                // 处理页面切换
                const handlePageChange = (pageId, withAnimation = false) => {
                    useAnimation.value = withAnimation;
                    const newIndex = pageOrder.indexOf(pageId);
                    currentIndex.value = newIndex;
                    currentPage.value = pageId;
                };

                // 处理页面按钮点击（切换锁定状态）
                const handlePageClick = (pageId) => {
                    if (currentPage.value === pageId) {
                        // 点击当前页面，切换锁定状态
                        pageLocked.value = !pageLocked.value;
                    } else {
                        // 点击其他页面，切换并锁定
                        handlePageChange(pageId);
                        pageLocked.value = true;
                    }
                };

                // 处理箭头按钮点击
                const handleArrowClick = () => {
                    const currentIdx = filteredPageOrder.value.indexOf(currentPage.value);
                    const nextIndex = (currentIdx + 1) % filteredPageOrder.value.length;
                    handlePageChange(filteredPageOrder.value[nextIndex], true);
                };

                // 检查输入是否为有效的URL
                const isValidUrl = (string) => {
                    try {
                        // 检查是否包含域名格式
                        const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
                        return urlPattern.test(string) || string.includes('.');
                    } catch (_) {
                        return false;
                    }
                };

                // 根据当前页面和搜索条件过滤书签
                const filteredCategories = computed(() => {
                    const query = searchQuery.value.trim();

                    // 检查是否是直接跳转命令
                    if (query.toLowerCase().startsWith('vpn ')) {
                        const domain = query.slice(4).trim();
                        if (domain) {
                            return [{
                                name: '校内访问',
                                links: [{
                                    name: `跳转到 ${domain}`,
                                    url: `vpn ${domain}`,
                                    isVpnDirect: true
                                }]
                            }];
                        }
                    }

                    // 检查域名是否存在于学术板块
                    const checkAcademicDomain = (url) => {
                        let cleanUrl = url.replace(/^https?:\/\//, '');
                        const pathIndex = cleanUrl.indexOf('/');
                        const hostPart = pathIndex > -1 ? cleanUrl.substring(0, pathIndex) : cleanUrl;
                        // 移除端口号
                        const domain = hostPart.replace(/:\d+$/, '');
                        
                        const academicBookmarks = bookmarks.value['academic'] || [];
                        for (const category of academicBookmarks) {
                            for (const link of category.links) {
                                let linkDomain = link.url.replace(/^https?:\/\//, '');
                                const linkPathIndex = linkDomain.indexOf('/');
                                linkDomain = linkPathIndex > -1 ? linkDomain.substring(0, linkPathIndex) : linkDomain;
                                linkDomain = linkDomain.replace(/:\d+$/, '');
                                
                                if (domain === linkDomain || domain.endsWith('.' + linkDomain) || linkDomain.endsWith('.' + domain)) {
                                    return true;
                                }
                            }
                        }
                        return false;
                    };

                    // 如果有搜索条件，从所有页面搜索
                    if (query) {
                        const allResults = [];
                        const lowerQuery = query.toLowerCase();

                    // 遍历所有页面（搜索时显示所有，包括隐藏的）
                    const pagesToSearch = showAll.value ? Object.keys(bookmarks.value) : 
                        Object.keys(bookmarks.value).filter(key => {
                            const pageInfo = pages.value.find(p => p.id === key);
                            return pageInfo && !hiddenItems.includes(pageInfo.name);
                        });
                    
                    pagesToSearch.forEach(pageKey => {
                            const pageBookmarks = bookmarks.value[pageKey];
                            pageBookmarks.forEach(category => {
                                const matchedLinks = category.links.filter(link =>
                                    link.name.toLowerCase().includes(lowerQuery) ||
                                    link.url.toLowerCase().includes(lowerQuery)
                                );

                                if (matchedLinks.length > 0) {
                                    // 找到匹配的分类，添加页面信息
                                    const pageInfo = pages.value.find(p => p.id === pageKey);
                                    allResults.push({
                                        name: `${category.name} (${pageInfo ? pageInfo.name : pageKey})`,
                                        links: matchedLinks
                                    });
                                }
                            });
                        });

                        // 如果没有搜索结果且输入看起来像URL，添加直接跳转选项
                        if (allResults.length === 0 && isValidUrl(query)) {
                            // 确保URL有协议前缀
                            let processedUrl = query;
                            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                                processedUrl = 'https://' + query;
                            }

                            // 检查是否是学术数据库域名
                            const isAcademic = checkAcademicDomain(processedUrl);
                            
                            // 限制显示文本长度
                            const truncateText = (text, maxLength = 30) => {
                                return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
                            };
                            
                            if (isAcademic) {
                                // 学术数据库域名
                                allResults.push({
                                    name: '此数据库支持校园网免费访问',
                                    links: [{
                                        name: webvpnMode.value > 0 ? `访问 ${truncateText(query)}` : '请打开校内模式',
                                        url: processedUrl,
                                        isDirectAccess: true,
                                        isAcademicAccess: true,
                                        disabled: webvpnMode.value === 0
                                    }]
                                });
                            } else {
                                allResults.push({
                                    name: '直接访问',
                                    links: [{
                                        name: `访问 ${truncateText(query)}`,
                                        url: processedUrl,
                                        isDirectAccess: true
                                    }]
                                });
                            }
                        }

                        return allResults;
                    }

                    // 没有搜索条件时，显示当前页面内容
                    const currentBookmarks = bookmarks.value[currentPage.value] || [];
                    return currentBookmarks.map(category => {
                        return {
                            ...category,
                            links: category.links
                        };
                    });
                });

                return {
                    searchQuery,
                    filteredCategories,
                    showBeian,
                    currentPage,
                    filteredPages,
                    pageLocked,
                    handlePageChange,
                    handlePageClick,
                    handleArrowClick,
                    useAnimation,
                    webvpnMode,
                    toggleWebVPN,
                    webvpnButtonText,
                    getProcessedUrl,
                    handleLinkClick,
                    isVpnDirectMode,
                    vpnDirectDomain,
                    handleVpnDirectJump
                };
            }
        }).mount('#app');
